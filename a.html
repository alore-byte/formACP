<Html>

<head>
    <title>Forms in html</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>
                <h3>Libary Detials</h3>
            </legend>
            <br><br><label>Name:</label>
            <input type="text" id="n">

            <br><br><label>Age:</label>
            <input type="Number" id="a">

            <br><br><label>email:</label>
            <input type="Email" id="e">

            <br><br><label>Password:</label>
            <input type="password" id="p">

            <br><br><label>Birth Date:</label>
            <input type="Date" id="b">

            <br><br><label>School:</label>
            <input type="Letter" id="s">

            <br><br><label>Gender:</label>
            <input type="radio" id="female" name="gender" value="female">female
            <input type="radio" id="Male" name="gender" value="Male">Male


            <br><br><label>Favoiurte book:</label>
            <input type="checkbox" id="hobby" value="sports">comic
            <input type="checkbox" id="hobby" value="Music">novel
            <input type="checkbox" id="hobby" value="Arts">picture books

            <br><br>
            <input type="submit" id="s">
        </fieldset>
    </form>
</body>

</Html>
